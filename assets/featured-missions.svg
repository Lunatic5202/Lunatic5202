<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Lunatic5202 featured missions</title>
  <desc id="desc">A Tracker-inspired mission board showing five projects, their focus, technology signals, and build status</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08131e"/><stop offset="1" stop-color="#0d2232"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b7f8ff"/><stop offset=".45" stop-color="#58dff5"/><stop offset="1" stop-color="#1e87b8"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff7280"/><stop offset="1" stop-color="#ff4655"/></linearGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="650" fill="url(#bg)"/>
  <path d="M0 0h1200v8H0z" fill="url(#red)" filter="url(#softGlow)"/>
  <path d="M0 8h720v2H0z" fill="url(#cyan)"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="36" y="54" fill="#eaffff" font-size="27" font-weight="700" letter-spacing="5">FEATURED MISSIONS</text>
    <text x="1160" y="52" fill="#75e8ff" text-anchor="end" font-size="14" letter-spacing="3">PROFILE // LUNATIC5202</text>
    <text x="36" y="82" fill="#6c9bae" font-size="13" letter-spacing="3">MISSION QUEUE  ·  05 BUILDS  ·  04 TECHNOLOGY LANES</text>
    <text x="36" y="118" fill="#5a8495" font-size="12" letter-spacing="2">SLOT</text>
    <text x="122" y="118" fill="#5a8495" font-size="12" letter-spacing="2">MISSION</text>
    <text x="545" y="118" fill="#5a8495" font-size="12" letter-spacing="2">FOCUS</text>
    <text x="785" y="118" fill="#5a8495" font-size="12" letter-spacing="2">SIGNAL</text>
    <text x="1100" y="118" fill="#5a8495" text-anchor="end" font-size="12" letter-spacing="2">STATUS</text>
  </g>
  <g stroke="#254356" stroke-width="1"><path d="M36 132h1128"/><path d="M36 232h1128"/><path d="M36 332h1128"/><path d="M36 432h1128"/><path d="M36 532h1128"/><path d="M36 610h1128"/></g>
  <g font-family="Arial,Helvetica,sans-serif">
    <g transform="translate(36 148)"><text fill="#75e8ff" font-size="25" font-weight="700">01</text><text x="86" y="3" fill="#f2ffff" font-size="21" font-weight="700" letter-spacing="2">MAITRI</text><text x="86" y="30" fill="#85a9b7" font-size="14">Real-time audio emotion detection</text><text x="509" y="3" fill="#dcefff" font-size="15">AUDIO / AI</text><text x="749" y="3" fill="#75e8ff" font-size="14" letter-spacing="1">PYTHON  ·  FASTAPI  ·  REACT</text><text x="1128" y="3" fill="#75e8ff" text-anchor="end" font-size="14" font-weight="700" letter-spacing="2">ACTIVE</text><rect x="86" y="56" width="316" height="4" fill="#17394b"/><rect x="86" y="56" width="290" height="4" fill="url(#cyan)" filter="url(#softGlow)"/></g>
    <g transform="translate(36 248)"><text fill="#75e8ff" font-size="25" font-weight="700">02</text><text x="86" y="3" fill="#f2ffff" font-size="21" font-weight="700" letter-spacing="2">DRISHTI MISSION CONSOLE</text><text x="86" y="30" fill="#85a9b7" font-size="14">ISRO-inspired exoplanet control room</text><text x="509" y="3" fill="#dcefff" font-size="15">SCIENCE / UI</text><text x="749" y="3" fill="#75e8ff" font-size="14" letter-spacing="1">TYPESCRIPT  ·  TANSTACK  ·  RECHARTS</text><text x="1128" y="3" fill="#75e8ff" text-anchor="end" font-size="14" font-weight="700" letter-spacing="2">ONLINE</text><rect x="86" y="56" width="316" height="4" fill="#17394b"/><rect x="86" y="56" width="316" height="4" fill="url(#cyan)" filter="url(#softGlow)"/></g>
    <g transform="translate(36 348)"><text fill="#75e8ff" font-size="25" font-weight="700">03</text><text x="86" y="3" fill="#f2ffff" font-size="21" font-weight="700" letter-spacing="2">JOURNEY TO DISCOVER</text><text x="86" y="30" fill="#85a9b7" font-size="14">Travel analytics and hidden-gem discovery</text><text x="509" y="3" fill="#dcefff" font-size="15">DATA / RESEARCH</text><text x="749" y="3" fill="#75e8ff" font-size="14" letter-spacing="1">R  ·  SHINY  ·  RMD</text><text x="1128" y="3" fill="#75e8ff" text-anchor="end" font-size="14" font-weight="700" letter-spacing="2">ANALYZED</text><rect x="86" y="56" width="316" height="4" fill="#17394b"/><rect x="86" y="56" width="260" height="4" fill="url(#cyan)" filter="url(#softGlow)"/></g>
    <g transform="translate(36 448)"><text fill="#75e8ff" font-size="25" font-weight="700">04</text><text x="86" y="3" fill="#f2ffff" font-size="21" font-weight="700" letter-spacing="2">STYLE-IN-STORE</text><text x="86" y="30" fill="#85a9b7" font-size="14">Component-driven storefront interface</text><text x="509" y="3" fill="#dcefff" font-size="15">COMMERCE / UI</text><text x="749" y="3" fill="#75e8ff" font-size="14" letter-spacing="1">TYPESCRIPT  ·  VITE  ·  TAILWIND</text><text x="1128" y="3" fill="#75e8ff" text-anchor="end" font-size="14" font-weight="700" letter-spacing="2">BUILDING</text><rect x="86" y="56" width="316" height="4" fill="#17394b"/><rect x="86" y="56" width="220" height="4" fill="url(#red)" filter="url(#softGlow)"/></g>
    <g transform="translate(36 548)"><text fill="#75e8ff" font-size="25" font-weight="700">05</text><text x="86" y="3" fill="#f2ffff" font-size="21" font-weight="700" letter-spacing="2">BT--PROJECTS</text><text x="86" y="30" fill="#85a9b7" font-size="14">Active workspace for the next mission</text><text x="509" y="3" fill="#dcefff" font-size="15">WORKSPACE / LAB</text><text x="749" y="3" fill="#75e8ff" font-size="14" letter-spacing="1">TYPESCRIPT  ·  CSS  ·  PYTHON</text><text x="1128" y="3" fill="#75e8ff" text-anchor="end" font-size="14" font-weight="700" letter-spacing="2">DEPLOYED</text></g>
  </g>
  <g fill="#ff4655"><circle cx="1136" cy="70" r="4"><animate attributeName="opacity" values="1;.25;1" dur="1.3s" repeatCount="indefinite"/></circle></g>
</svg>

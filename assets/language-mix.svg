<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Lunatic5202 language mix</title>
  <desc id="desc">Primary repository languages: TypeScript, HTML, R, and Python</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#0d2435"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#77eaff"/><stop offset="1" stop-color="#2e91c9"/></linearGradient>
  </defs>
  <rect x="2" y="2" width="956" height="256" rx="18" fill="url(#bg)" stroke="#77eaff" stroke-opacity=".35"/>
  <text x="28" y="34" fill="#77eaff" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="4">TOP LANGUAGES // PRIMARY REPOSITORY SIGNAL</text>
  <text x="932" y="34" fill="#ff4655" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2">NO API DEPENDENCY</text>
  <g font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#e9fdff">
    <text x="30" y="78">TypeScript</text><text x="30" y="123">HTML</text><text x="30" y="168">R</text><text x="30" y="213">Python</text>
    <text x="930" y="78" text-anchor="end" fill="#9ab7c4">3 repos</text><text x="930" y="123" text-anchor="end" fill="#9ab7c4">1 repo</text><text x="930" y="168" text-anchor="end" fill="#9ab7c4">1 repo</text><text x="930" y="213" text-anchor="end" fill="#9ab7c4">Maitri backend</text>
  </g>
  <g>
    <rect x="160" y="64" width="580" height="19" rx="9" fill="#183346"/><rect x="160" y="64" width="348" height="19" rx="9" fill="url(#bar)"/><text x="525" y="79" fill="#071018" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">TYPESCRIPT</text>
    <rect x="160" y="109" width="580" height="19" rx="9" fill="#183346"/><rect x="160" y="109" width="116" height="19" rx="9" fill="#ff4655"/><text x="292" y="124" fill="#e9fdff" font-family="Arial,Helvetica,sans-serif" font-size="13">HTML</text>
    <rect x="160" y="154" width="580" height="19" rx="9" fill="#183346"/><rect x="160" y="154" width="116" height="19" rx="9" fill="#f3c969"/><text x="292" y="169" fill="#071018" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">R</text>
    <rect x="160" y="199" width="580" height="19" rx="9" fill="#183346"/><rect x="160" y="199" width="116" height="19" rx="9" fill="#77eaff"/><text x="292" y="214" fill="#071018" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">PYTHON</text>
  </g>
  <text x="28" y="242" fill="#9ab7c4" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1">Based on the five public repositories shown on the profile.</text>
